[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patchsmith"
version = "0.2.0"
description = "Autonomous Code Repair & Software Engineering Research Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "AKIL3333"}]
keywords = ["ai", "agents", "software-engineering", "code-repair", "swe-bench"]

dependencies = [
    "anthropic>=0.37.0",
    "openai>=1.40.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "gitpython>=3.1",
    "PyGithub>=2.0",
    "pytest>=8.0",
    "flake8>=7.0",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3.0", "torch>=2.0"]
eval    = ["datasets>=2.0", "tqdm>=4.0"]
dev     = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.3"]

[project.scripts]
patchsmith = "patchsmith.cli:main"

[project.urls]
Repository = "https://github.com/AKIL3333/patchsmith"

[tool.setuptools.packages.find]
include = ["patchsmith*"]
where = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
